           updateFadeHandlesUI(); drawEditorWaveform(editorState.playhead);
        };
        const onU = () => { document.removeEventListener('mousemove', onM); document.removeEventListener('mouseup', onU); };
        document.addEventListener('mousemove', onM); document.addEventListener('mouseup', onU);
      };
      hl.addEventListener('mousedown', e => resize(e, 'l'));
      hr.addEventListener('mousedown', e => resize(e, 'r'));
      // Track click to jump
      wrap.addEventListener('mousedown', e => {
         if (e.target === vp || vp.contains(e.target)) return;
         const wrapR = wrap.getBoundingClientRect(), viewLen = editorState.viewEnd - editorState.viewStart;
         let frac = (e.clientX - wrapR.left) / wrapR.width, nVs = frac - viewLen / 2, nVe = frac + viewLen / 2;
         if (nVs < 0) { nVs = 0; nVe = viewLen; } if (nVe > 1) { nVe = 1; nVs = 1 - viewLen; }
         editorState.viewStart = nVs; editorState.viewEnd = nVe; updateFadeHandlesUI(); drawEditorWaveform(editorState.playhead);
      });
      // Double click to zoom to crop
      wrap.addEventListener('dblclick', e => {
         const cs = editorState.cropStart, ce = editorState.cropEnd, margin = (ce - cs) * 0.04;
         editorState.viewStart = Math.max(0, cs - margin); editorState.viewEnd = Math.min(1, ce + margin);
         updateFadeHandlesUI(); drawEditorWaveform(editorState.playhead);
      });
    })();

    function showSCurveCtx(e, type) {
      closeFadeCtx();
      const menu = document.createElement('div');
      menu.className = 'ed-fade-ctx active';
      const isSCurve = type === 'linkL' ? editorState.fadeInSCurve : editorState.fadeOutSCurve;
      
      const title = document.createElement('div');
      title.className = 'ed-fade-ctx-title';
      title.textContent = type === 'linkL' ? 'Fade In Mode' : 'Fade Out Mode';
      menu.appendChild(title);
      
      const optPow = document.createElement('div');
      optPow.className = 'ed-fade-ctx-item' + (!isSCurve ? ' active' : '');
      optPow.textContent = 'Power Curve';
      optPow.onclick = () => { if (type === 'linkL') editorState.fadeInSCurve = false; else editorState.fadeOutSCurve = false; drawEditorWaveform(); closeFadeCtx(); };
      
      const optS = document.createElement('div');
      optS.className = 'ed-fade-ctx-item' + (isSCurve ? ' active' : '');
      optS.textContent = 'S-Curve';
      optS.onclick = () => { if (type === 'linkL') editorState.fadeInSCurve = true; else editorState.fadeOutSCurve = true; drawEditorWaveform(); closeFadeCtx(); };
      
      menu.appendChild(optPow); menu.appendChild(optS);
      const wrap = document.getElementById('editor-waveform-wrap'); wrap.appendChild(menu);
      const r = wrap.getBoundingClientRect();
      menu.style.left = Math.min(e.clientX - r.left, r.width - 120) + 'px';
      menu.style.top = Math.min(e.clientY - r.top, r.height - 80) + 'px';
      fadeCtxEl = menu;
    }
    let fadeCtxEl = null;
    function closeFadeCtx() { if (fadeCtxEl) { fadeCtxEl.remove(); fadeCtxEl = null; } }
    document.addEventListener('click', e => { if (fadeCtxEl && !e.target.closest('.ed-fade-ctx')) closeFadeCtx(); });

    // ── Gain slider ──
    const gainSlider = document.getElementById('ed-gain-slider');
    gainSlider.addEventListener('input', function () {
      editorState.gain = parseFloat(this.value);
      const g = editorState.gain;
      document.getElementById('ed-gain-val').textContent = (g >= 0 ? '+' : '') + g + ' dB';
      document.getElementById('ed-gain-overlay').textContent = (g >= 0 ? '+' : '') + g + ' dB';
      drawEditorWaveform(editorState.playhead);
    });
    // Wheel on waveform still adjusts gain as secondary
    document.getElementById('editor-waveform-wrap').addEventListener('wheel', e => {
      if (!editorState.isOpen) return; e.preventDefault();
      const delta = e.deltaY > 0 ? -0.5 : 0.5;
      editorState.gain = Math.round(Math.max(-24, Math.min(12, editorState.gain + delta)) * 10) / 10;
      gainSlider.value = editorState.gain;
      const g = editorState.gain;
      document.getElementById('ed-gain-val').textContent = (g >= 0 ? '+' : '') + g + ' dB';
      document.getElementById('ed-gain-overlay').textContent = (g >= 0 ? '+' : '') + g + ' dB';
      drawEditorWaveform(editorState.playhead);
    }, { passive: false });

    // ── Pitch slider ──
    const pitchSlider = document.getElementById('ed-pitch-slider');
    pitchSlider.addEventListener('input', function () {
      editorState.pitch = parseFloat(this.value);
      const p = editorState.pitch;
      document.getElementById('ed-pitch-val').textContent = (p >= 0 ? '+' : '') + p.toFixed(2) + ' st';
    });
    // Double-click to reset pitch
    pitchSlider.addEventListener('dblclick', () => {
      editorState.pitch = 0; pitchSlider.value = 0;
      document.getElementById('ed-pitch-val').textContent = '0.00 st';
    });
    // Double-click to reset gain
    document.getElementById('ed-gain-slider').addEventListener('dblclick', () => {
      editorState.gain = 0; gainSlider.value = 0;
      document.getElementById('ed-gain-val').textContent = '0 dB';
      document.getElementById('ed-gain-overlay').textContent = '0 dB';
      drawEditorWaveform(editorState.playhead);
    });

    // ── Reverse toggle (visually flips waveform) ──
    document.getElementById('ed-ctrl-rev').addEventListener('click', () => {
      editorState.reversed = !editorState.reversed;
      document.getElementById('ed-ctrl-rev').classList.toggle('active', editorState.reversed);
      drawEditorWaveform(editorState.playhead);
    });

    // ── Cut Mode Toggle ──
    document.getElementById('ed-ctrl-cut').addEventListener('click', () => {
      editorState.cutMode = !editorState.cutMode;
      document.getElementById('ed-ctrl-cut').classList.toggle('active', editorState.cutMode);
      if(!editorState.cutMode) {
         editorState.cutStart = 0; editorState.cutEnd = 0;
         updateCutSelectionUI();
      }
      updateFadeHandlesUI();
    });

    function updateCutSelectionUI() {
      const sel = document.getElementById('ed-cut-sel'), btn = document.getElementById('ed-cut-confirm');
      if (!editorState.cutMode || editorState.cutEnd <= editorState.cutStart) {
        sel.classList.remove('visible'); btn.classList.remove('visible'); return;
      }
      sel.classList.add('visible'); btn.classList.add('visible');
      const toViewPc = val => Math.min(100, Math.max(-100, ((val - editorState.viewStart) / (editorState.viewEnd - editorState.viewStart)) * 100));
      const s = toViewPc(editorState.cutStart), e = toViewPc(editorState.cutEnd);
      sel.style.left = Math.max(0, s) + '%';
      sel.style.width = Math.max(0, e - Math.max(0, s)) + '%';
      btn.style.left = Math.min(90, Math.max(10, (Math.max(0, s) + Math.max(0, e - Math.max(0, s)) / 2))) + '%';
    }

    // ── Editor playback ──
    function edStopAudio() {
      if (editorState.source) { try { editorState.source.stop(); } catch (e) { } editorState.source.disconnect(); editorState.source = null; }
      editorState.isPlaying = false; if (editorState.raf) { cancelAnimationFrame(editorState.raf); editorState.raf = null; }
      const btn = document.getElementById('editor-play-btn'); btn.classList.remove('playing');
      btn.innerHTML = '<svg width="10" height="12" viewBox="0 0 12 14"><polygon points="2,0 12,7 2,14" fill="#c8f76d"/></svg>';
    }
    async function edPlayAudio() {
      if (!selection) return; edStopAudio(); const rawBuf = bufferCache.get(selection.path); if (!rawBuf) return;
      const processed = await buildProcessedBuffer(); if (!processed) return; const ctx = getCtx();
      const src = ctx.createBufferSource(); src.buffer = processed;
      src.connect(gainNode);
      src.start(0);
      editorState.source = src; editorState.isPlaying = true;
      editorState.startTime = ctx.currentTime;
      src.onended = () => { if (editorState.isPlaying) { editorState.playhead = editorState.cropStart; edStopAudio(); drawEditorWaveform(0); } };
      const btn = document.getElementById('editor-play-btn'); btn.classList.add('playing');
      btn.innerHTML = '<svg width="10" height="12" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="#111"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="#111"/></svg>';
      const dur = processed.duration;
      (function animate() {
        if (!editorState.isPlaying) return; const el = ctx.currentTime - editorState.startTime;
        const processedFrac = Math.min(el / dur, 1);
        editorState.playhead = editorState.cropStart + processedFrac * (editorState.cropEnd - editorState.cropStart);
        document.getElementById('editor-time-display').textContent = formatTime(el) + ' / ' + formatTime(dur);
        drawEditorWaveform(editorState.playhead);
        const vs = editorState.viewStart, ve = editorState.viewEnd;
        const ph = document.getElementById('editor-playhead'); 
        if (editorState.playhead >= vs && editorState.playhead <= ve) {
           ph.style.left = ((editorState.playhead - vs) / (ve - vs)) * 100 + '%'; 
           ph.classList.add('active');
        } else {
           ph.classList.remove('active');
        }
        editorState.raf = requestAnimationFrame(animate);
      })();
    }
    document.getElementById('editor-play-btn').addEventListener('click', () => {
      if (editorState.isPlaying) { editorState.playhead = editorState.cropStart; if (editorState.source) { try { editorState.source.stop(); } catch (e) { } } edStopAudio(); }
      else edPlayAudio();
    });



    // ── Build processed buffer ──
    async function buildProcessedBuffer() {
      if (!selection) return null; const orig = bufferCache.get(selection.path); if (!orig) return null;
      const selLenOrig = Math.floor(selection.end * orig.length) - Math.floor(selection.start * orig.length);
      const ssOrig = Math.floor(selection.start * orig.length);
      
      let virtCs = editorState.cropStart, virtCe = editorState.cropEnd;
      if (editorState.reversed) {
         virtCs = 1 - editorState.cropEnd;
         virtCe = 1 - editorState.cropStart;
      }
      
      const cs = editorState.cropStart, ce = editorState.cropEnd; // visual coordinates for FADES
      const ss = ssOrig + Math.floor(virtCs * selLenOrig);
      const se = ssOrig + Math.floor(virtCe * selLenOrig);
      let len = se - ss; if (len <= 0) return null; const nc = orig.numberOfChannels, sr = orig.sampleRate;
      let channels = []; for (let ch = 0; ch < nc; ch++) channels.push(Float32Array.from(orig.getChannelData(ch).slice(ss, se)));
      
      // Reverse
      if (editorState.reversed) { for (let ch = 0; ch < nc; ch++) channels[ch].reverse(); }
      
      // Gain + Fades
      const gainLin = Math.pow(10, editorState.gain / 20);
      const fi = editorState.fadeInEnd, fo = editorState.fadeOutStart;
      const fadeSamplesIn = Math.floor((fi - cs) * selLenOrig);
      const fadeSamplesOut = Math.floor((ce - fo) * selLenOrig);
      
      for (let ch = 0; ch < nc; ch++) {
        const d = channels[ch]; for (let i = 0; i < len; i++) {
          let env = 1;
          if (fadeSamplesIn > 0 && i < fadeSamplesIn) env = calcVolume(i / fadeSamplesIn, editorState.fadeInTension, editorState.fadeInSCurve);
          if (fadeSamplesOut > 0 && (len - 1 - i) < fadeSamplesOut) env = Math.min(env, calcVolume((len - 1 - i) / fadeSamplesOut, editorState.fadeOutTension, editorState.fadeOutSCurve));
          d[i] *= env * gainLin;
        }
      }
      // Pitch shift — varispeed: changes pitch AND duration together
      const totalCents = Math.round(editorState.pitch * 100);
      if (totalCents !== 0) {
        const rate = Math.pow(2, totalCents / 1200);
        const newLen = Math.round(len / rate);
        const offCtx = new OfflineAudioContext(nc, newLen, sr);
        const tmpBuf = offCtx.createBuffer(nc, len, sr);
        for (let ch = 0; ch < nc; ch++) tmpBuf.copyToChannel(channels[ch], ch);
        const src = offCtx.createBufferSource(); src.buffer = tmpBuf; src.playbackRate.value = rate;
        src.connect(offCtx.destination); src.start();
        const rendered = await offCtx.startRendering();
        channels = []; for (let ch = 0; ch < nc; ch++) channels.push(new Float32Array(rendered.getChannelData(ch)));
        len = channels[0].length;
      }
      const ctx = getCtx(); const out = ctx.createBuffer(nc, len, sr); for (let ch = 0; ch < nc; ch++) out.copyToChannel(channels[ch], ch); return out;
    }

    // ── Editor drag export ──
    document.getElementById('editor-drag-btn').addEventListener('dragstart', async e => {
      e.preventDefault(); const processed = await buildProcessedBuffer(); if (!processed) return;
      const nc = processed.numberOfChannels, sr = processed.sampleRate, len = processed.length;
      const cd = []; for (let ch = 0; ch < nc; ch++) cd.push(processed.getChannelData(ch));
      const snd = sounds.find(x => x.path === selection?.path);
      const nm = (snd ? snd.name.replace(/\.wav$/i, '') : 'edit') + '_edit.wav';
      const tmp = await window.api.renderSelectionWav({ channelData: cd, sampleRate: sr, numChannels: nc, bitDepth: 24, fileName: nm });
      if (tmp) window.api.startDrag(tmp);
    });


    // Init
    const COL_PALETTE = ['#c8f76d', '#f76d6d', '#6db4f7', '#f7c36d', '#c46df7', '#6df7d8', '#f76dbb', '#f79e6d', '#6d8af7', '#a8f76d', '#f76d8e', '#6df7a8'];
    function showColColorPicker(e, colName, currentColor) {
      const picker = document.getElementById('col-color-picker');
      picker.innerHTML = COL_PALETTE.map(c => `<div class="col-color-swatch${c === currentColor ? ' selected' : ''}" style="background:${c}" data-color="${c}"></div>`).join('') + `<div class="col-color-swatch${!currentColor ? ' selected' : ''}" style="background:var(--bg-hover);border:.5px dashed #666" data-color="" title="No color"></div>`;
      const rect = e.target.getBoundingClientRect();
      picker.style.left = rect.right + 6 + 'px'; picker.style.top = rect.top - 4 + 'px';
      picker.classList.add('active');
      picker.querySelectorAll('.col-color-swatch').forEach(sw => { sw.addEventListener('click', async ev => { ev.stopPropagation(); const color = sw.dataset.color; await window.api.setCollectionColor(colName, color); picker.classList.remove('active'); await loadCollections() }) });
    }
    document.addEventListener('click', e => { if (!e.target.closest('.col-color-picker') && !e.target.closest('.col-color-dot')) document.getElementById('col-color-picker').classList.remove('active') });

    // Init
    async function init() { await loadFolders(); await loadCollections(); const f = await window.api.getFolders(); if (f.length) await selectFolder(f[0].name) }
    init();
  </script>
</body>
